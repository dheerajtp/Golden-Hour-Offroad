<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Golden Hour Offroad</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141c33; overscroll-behavior: none; }
  #app, #app canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 600 15px/1.4 system-ui, sans-serif; color: #ffd9a0; background: #141c33;
    letter-spacing: 0.04em; transition: opacity 0.5s; z-index: 10;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #hint {
    position: absolute; left: 14px; bottom: 12px; z-index: 5;
    font: 500 12px/1.5 system-ui, sans-serif; color: rgba(255, 240, 220, 0.85);
    text-shadow: 0 1px 3px rgba(0,0,0,0.6); pointer-events: none;
  }
  #panel {
    position: absolute; top: 12px; right: 12px; z-index: 20; width: 230px;
    background: rgba(20, 28, 51, 0.88); border: 1px solid rgba(255, 201, 160, 0.35);
    border-radius: 8px; padding: 12px; color: #ffd9a0;
    font: 500 13px/1.6 system-ui, sans-serif;
  }
  #panel.hidden { display: none; }
  #panel .dim { opacity: 0.65; font-size: 11px; margin-top: 4px; }
  #panel b { font-size: 22px; letter-spacing: 0.25em; color: #ffc9a0; }
  #panel button {
    background: #b8442e; color: #fff; border: 0; border-radius: 5px;
    padding: 5px 10px; font: 600 12px system-ui, sans-serif; cursor: pointer;
  }
  #panel button:hover { background: #d05138; }
  #panel input {
    width: 74px; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,201,160,0.4);
    border-radius: 5px; color: #ffc9a0; font: 700 14px/1 system-ui, sans-serif;
    padding: 6px 7px; text-transform: uppercase; letter-spacing: 0.2em;
  }
  #pCodeRow, #pControls { margin-top: 8px; }
  #raceHud {
    position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%);
    font: 800 110px/1 system-ui, sans-serif; color: #fff2e0;
    text-shadow: 0 4px 22px rgba(0,0,0,0.55); z-index: 15; pointer-events: none;
  }
  #raceHud.hidden, #raceToast.hidden, #restHint.hidden, #touch.hidden { display: none; }
  #restHint {
    position: absolute; left: 50%; bottom: 26%; transform: translateX(-50%);
    font: 700 16px/1.3 system-ui, sans-serif; color: #141c33;
    background: rgba(255, 217, 160, 0.92); border-radius: 8px;
    padding: 10px 18px; z-index: 16; cursor: pointer;
    pointer-events: auto; white-space: nowrap;
    animation: restPulse 1.6s ease-in-out infinite;
  }
  @keyframes restPulse { 50% { opacity: 0.6; } }
  #fade {
    position: absolute; inset: 0; background: #0a0c14; z-index: 40;
    opacity: 0; pointer-events: none; transition: opacity 0.55s ease;
  }
  #fade.on { opacity: 1; pointer-events: auto; }
  #touch { position: absolute; inset: 0; z-index: 18; pointer-events: none; }
  body.touch { touch-action: none; }
  .tbtn {
    position: absolute; pointer-events: auto;
    width: 76px; height: 76px; border-radius: 50%;
    background: rgba(20, 28, 51, 0.5); border: 1.5px solid rgba(255, 201, 160, 0.45);
    color: #ffd9a0; font: 700 26px/1 system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; padding: 0;
  }
  .tbtn:active, .tbtn.on { background: rgba(184, 68, 46, 0.75); }
  .tbtn.small {
    width: 46px; height: 46px; font-size: 15px;
    background: rgba(20, 28, 51, 0.42);
  }
  #tLeft { left: 16px; bottom: 34px; }
  #tRight { left: 106px; bottom: 34px; }
  #tGas { right: 16px; bottom: 122px; }
  #tBrake { right: 106px; bottom: 34px; }
  #tBar {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; gap: 8px; pointer-events: auto;
  }
  #tBar .tbtn {
    position: static; width: 46px; height: 46px; font-size: 15px;
    background: rgba(20, 28, 51, 0.42);
  }
  @media (max-width: 480px) {
    #hint { display: none; }
    .tbtn { width: 68px; height: 68px; }
    #tRight { left: 94px; }
    #tBrake { right: 94px; }
    #panel { width: 200px; top: 8px; right: 8px; }
    #raceHud { font-size: 74px; }
    #restHint { font-size: 14px; bottom: 32%; }
  }
  #raceToast {
    position: absolute; left: 50%; top: 20%; transform: translateX(-50%);
    font: 700 24px/1.3 system-ui, sans-serif; color: #ffd9a0;
    background: rgba(20, 28, 51, 0.85); border: 1px solid rgba(255, 201, 160, 0.4);
    border-radius: 8px; padding: 12px 22px; z-index: 15; pointer-events: none;
    text-align: center;
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="loading">Loading the trail…</div>
<div id="hint">WASD / arrows drive · 1 2 3 trucks · M play with friends · hold T fast-forward time</div>
<div id="panel" class="hidden">
  <div id="pStatus">Not connected — solo</div>
  <div id="pCodeRow" class="hidden">
    <div>Code: <b id="pCode">----</b> <button id="pCopy">copy</button></div>
    <div id="pCount" class="dim">waiting for friends…</div>
    <div class="dim">friends: open the game, press M, enter this code</div>
  </div>
  <div id="pControls">
    <input id="pCodeIn" maxlength="4" placeholder="CODE" autocomplete="off">
    <button id="pJoin">join</button>
    <button id="pHostBtn">host</button>
  </div>
  <button id="pLeave" class="hidden">leave session</button>
</div>
<div id="raceHud" class="hidden"></div>
<div id="raceToast" class="hidden"></div>
<div id="restHint" class="hidden">E — rest until morning</div>
<div id="fade"></div>
<div id="touch" class="hidden"></div>
<script src="vendor/peerjs.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
